<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" fill="#0A0A0A"/>

  <!-- Gradient -->
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D547"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>

  <!-- Large glasses logo centered -->
  <g transform="translate(48, 40)">
    <!-- Left lens (bigger) -->
    <circle cx="20" cy="40" r="26" fill="none" stroke="url(#lg)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right lens (bigger) -->
    <circle cx="76" cy="40" r="26" fill="none" stroke="url(#lg)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bridge -->
    <rect x="46" y="36" width="20" height="8" fill="url(#lg)" rx="4"/>

    <!-- Sparkle star (larger) -->
    <g transform="translate(48, 0)">
      <polygon points="0,-12 2.5,-3 12,-2 6,3 8,12 0,7 -8,12 -6,3 -12,-2 -2.5,-3" fill="url(#lg)"/>
    </g>
  </g>
</svg>
