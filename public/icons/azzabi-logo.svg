<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Background -->
  <rect width="180" height="180" fill="#0A0A0A" rx="36"/>

  <!-- Gradient -->
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D547"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>

  <!-- Azzabi Mark (glasses + sparkle) -->
  <g transform="translate(45, 30)">
    <!-- Left lens -->
    <circle cx="15" cy="30" r="18" fill="none" stroke="url(#lg)" stroke-width="3"/>
    <!-- Right lens -->
    <circle cx="60" cy="30" r="18" fill="none" stroke="url(#lg)" stroke-width="3"/>
    <!-- Bridge -->
    <rect x="33" y="28" width="14" height="4" fill="url(#lg)" rx="2"/>
    <!-- Sparkle -->
    <polygon points="37.5,0 38.5,6 44,6 39.5,10 40.5,16 37.5,12.5 34.5,16 35.5,10 31,6 36.5,6" fill="url(#lg)"/>
  </g>

  <!-- Text: AZZABI OPTIC -->
  <text x="90" y="145" font-family="Montserrat, sans-serif" font-size="18" font-weight="800" fill="url(#lg)" text-anchor="middle" letter-spacing="1">AZZABI</text>
  <text x="90" y="162" font-family="Montserrat, sans-serif" font-size="12" font-weight="700" fill="url(#lg)" text-anchor="middle" letter-spacing="2" opacity="0.8">OPTIC</text>
</svg>
